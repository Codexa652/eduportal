<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduPortal - Login</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <style>
    * {
      font-family: "Poppins", sans-serif;
    }

    .gradient-bg {
      background: linear-gradient(135deg,
          #9333ea 0%,
          #7B05E3 50%,
          #581c87 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .role-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .role-card:hover {
      transform: translateY(-4px);
    }

    .role-card.selected {
      border-color: #7B05E3;
      background: linear-gradient(135deg,
          rgba(123, 5, 227, 0.1) 0%,
          rgba(147, 51, 234, 0.1) 100%);
    }

    .form-container {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .form-container.teacher-mode {
      background: linear-gradient(135deg,
          rgba(251, 146, 60, 0.08) 0%,
          rgba(249, 115, 22, 0.08) 100%);
      border-top: 4px solid #fb9e3f;
    }

    .form-container.student-mode {
      background: linear-gradient(135deg,
          rgba(34, 197, 238, 0.08) 0%,
          rgba(59, 130, 246, 0.08) 100%);
      border-top: 4px solid #22c5ee;
    }

    .form-container.hod-mode {
      background: linear-gradient(135deg,
          rgba(34, 197, 98, 0.08) 0%,
          rgba(5, 150, 105, 0.08) 100%);
      border-top: 4px solid #22c562;
    }

    .btn-submit-teacher {
      background: linear-gradient(135deg, #fb9e3f 0%, #f97316 100%);
    }

    .btn-submit-teacher:hover {
      box-shadow: 0 10px 40px rgba(249, 115, 22, 0.4);
    }

    .btn-submit-student {
      background: linear-gradient(135deg, #22c5ee 0%, #3b82f6 100%);
    }

    .btn-submit-student:hover {
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.4);
    }

    .btn-submit-hod {
      background: linear-gradient(135deg, #22c562 0%, #059669 100%);
    }

    .btn-submit-hod:hover {
      box-shadow: 0 10px 40px rgba(5, 150, 105, 0.4);
    }

    .btn-primary {
      background: linear-gradient(135deg, #9333ea 0%, #7B05E3 100%);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(123, 5, 227, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .input-field {
      transition: all 0.3s ease;
      border: 2px solid #e5e7eb;
    }

    .input-field:focus {
      border-color: #7B05E3;
      box-shadow: 0 0 0 4px rgba(123, 5, 227, 0.1);
    }

    .floating-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
      animation: float 20s infinite ease-in-out;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-30px) rotate(180deg);
      }
    }

    .tab-btn {
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #9333ea 0%, #7B05E3 100%);
      color: white;
    }

    .success-message {
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <style>
    body {
      box-sizing: border-box;
    }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
</head>

<body class="h-full">
  <div class="gradient-bg h-full w-full overflow-auto relative">
    <!-- Floating Shapes -->
    <div class="floating-shape w-64 h-64 bg-white top-10 left-10" style="animation-delay: 0s"></div>
    <div class="floating-shape w-96 h-96 bg-white bottom-10 right-10" style="animation-delay: -5s"></div>
    <div class="floating-shape w-48 h-48 bg-white top-1/2 left-1/3" style="animation-delay: -10s"></div>
    <div class="min-h-full flex items-center justify-center p-6 relative z-10">
      <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-xl mb-4">
            <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
          </div>
          <h1 id="site-title" class="text-3xl font-bold text-white mb-2">
            EduPortal
          </h1>
          <p id="welcome-message" class="text-white/80">
            Welcome back! Please login to continue
          </p>
        </div>
        <!-- Main Card -->
        <div class="glass-card rounded-3xl shadow-2xl overflow-hidden">
          <!-- Tabs -->
          <div class="flex p-2 bg-gray-100">
            <button id="login-tab" class="tab-btn active flex-1 py-3 px-6 rounded-xl font-semibold text-sm"
              onclick="switchTab('login')">
              Login
            </button>
            <button id="signup-tab" class="tab-btn flex-1 py-3 px-6 rounded-xl font-semibold text-sm text-gray-600"
              onclick="switchTab('signup')">
              Sign Up
            </button>
          </div>
          <div class="p-8 form-container" id="form-container">
            <!-- Role Selection -->
            <div class="mb-6">
              <label class="block text-sm font-semibold text-gray-700 mb-3">I am a</label>
              <div class="grid grid-cols-3 gap-4">
                <button type="button" id="teacher-btn"
                  class="role-card border-2 border-gray-200 rounded-2xl p-4 text-center cursor-pointer"
                  onclick="selectRole('teacher')">
                  <div
                    class="w-14 h-14 mx-auto mb-3 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                    </svg>
                  </div>
                  <span class="font-semibold text-gray-800">Teacher</span>
                  <p class="text-xs text-gray-500 mt-1">Manage classes</p>
                </button>
                <button type="button" id="student-btn"
                  class="role-card border-2 border-gray-200 rounded-2xl p-4 text-center cursor-pointer"
                  onclick="selectRole('student')">
                  <div
                    class="w-14 h-14 mx-auto mb-3 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l9-5-9-5-9 5 9 5z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
                    </svg>
                  </div>
                  <span class="font-semibold text-gray-800">Student</span>
                  <p class="text-xs text-gray-500 mt-1">Access courses</p>
                </button>
                <button type="button" id="hod-btn"
                  class="role-card border-2 border-gray-200 rounded-2xl p-4 text-center cursor-pointer"
                  onclick="selectRole('hod')">
                  <div
                    class="w-14 h-14 mx-auto mb-3 rounded-xl bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                  </div>
                  <span class="font-semibold text-gray-800">HOD</span>
                  <p class="text-xs text-gray-500 mt-1">Manage department</p>
                </button>
              </div>
            </div>
            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)">
              <div class="space-y-4">
                <div>
                  <label for="login-email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                  <input type="email" id="login-email" required
                    class="input-field w-full px-4 py-3 rounded-xl outline-none" placeholder="you@example.com" />
                </div>
                <div>
                  <label for="login-password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                  <div class="relative">
                    <input type="password" id="login-password" required
                      class="input-field w-full px-4 py-3 rounded-xl outline-none pr-12" placeholder="••••••••" />
                    <button type="button"
                      class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                      onclick="togglePassword('login-password')">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="flex items-center justify-between">
                  <label class="flex items-center cursor-pointer">
                    <input type="checkbox"
                      class="w-4 h-4 rounded border-gray-300 text-purple-600 focus:ring-purple-500" />
                    <span class="ml-2 text-sm text-gray-600">Remember me</span>
                  </label>
                  <a href="#" class="text-sm text-purple-600 hover:text-purple-700 font-medium">Forgot password?</a>
                </div>
                <button type="submit" id="login-btn" disabled
                  class="btn-primary btn-submit-teacher w-full py-4 rounded-xl text-white font-semibold text-lg shadow-lg">
                  Login
                </button>
              </div>
            </form>
            <!-- Signup Form (Hidden by default) -->
            <form id="signup-form" class="hidden" onsubmit="handleSignup(event)">
              <div class="space-y-4">
                <div>
                  <label for="signup-name" class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
                  <input type="text" id="signup-name" required
                    class="input-field w-full px-4 py-3 rounded-xl outline-none" placeholder="John Doe" />
                </div>
                <div>
                  <label for="signup-email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                  <input type="email" id="signup-email" required
                    class="input-field w-full px-4 py-3 rounded-xl outline-none" placeholder="you@example.com" />
                </div>
                <div>
                  <label for="signup-password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                  <div class="relative">
                    <input type="password" id="signup-password" required minlength="8"
                      class="input-field w-full px-4 py-3 rounded-xl outline-none pr-12" placeholder="••••••••" />
                    <button type="button"
                      class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                      onclick="togglePassword('signup-password')">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                      </svg>
                    </button>
                  </div>
                  <p class="text-xs text-gray-500 mt-1">
                    Must be at least 8 characters
                  </p>
                </div>
                <div>
                  <label for="signup-confirm" class="block text-sm font-semibold text-gray-700 mb-2">Confirm
                    Password</label>
                  <input type="password" id="signup-confirm" required
                    class="input-field w-full px-4 py-3 rounded-xl outline-none" placeholder="••••••••" />
                </div>
                <div class="flex items-start">
                  <input type="checkbox" id="terms" required
                    class="w-4 h-4 mt-1 rounded border-gray-300 text-purple-600 focus:ring-purple-500" />
                  <label for="terms" class="ml-2 text-sm text-gray-600">
                    I agree to the
                    <a href="#" class="text-purple-600 hover:underline">Terms of Service</a>
                    and
                    <a href="#" class="text-purple-600 hover:underline">Privacy Policy</a>
                  </label>
                </div>
                <button type="submit" id="signup-btn" disabled
                  class="btn-primary btn-submit-teacher w-full py-4 rounded-xl text-white font-semibold text-lg shadow-lg">
                  Create Account
                </button>
              </div>
            </form>
            <!-- Success Message -->
            <div id="success-message"
              class="hidden success-message mt-6 p-4 bg-green-50 border border-green-200 rounded-xl">
              <div class="flex items-center">
                <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center mr-3">
                  <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                  </svg>
                </div>
                <div>
                  <p id="success-text" class="font-semibold text-green-800">
                    Success!
                  </p>
                  <p id="success-subtext" class="text-sm text-green-600"></p>
                </div>
              </div>
            </div>
          </div>
          <!-- Footer -->
          <p id="tagline" class="text-center p-6 text-white/70 text-sm">
            Empowering education, one click at a time 📚
          </p>
        </div>
      </div>
    </div>
    <script>
      // State
      let selectedRole = null;
      let currentTab = "login";

      // Default config
      const defaultConfig = {
        site_title: "EduPortal",
        welcome_message: "Welcome back! Please login to continue",
        tagline: "Empowering education, one click at a time 📚",
        primary_color: "#7B05E3",
        secondary_color: "#9333ea",
        text_color: "#1f2937",
        surface_color: "#ffffff",
        accent_color: "#581c87",
      };

      // Initialize Element SDK
      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            document.getElementById("site-title").textContent =
              config.site_title || defaultConfig.site_title;
            document.getElementById("welcome-message").textContent =
              config.welcome_message || defaultConfig.welcome_message;
            document.getElementById("tagline").textContent =
              config.tagline || defaultConfig.tagline;
          },
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () =>
                  config.primary_color || defaultConfig.primary_color,
                set: (value) =>
                  window.elementSdk.setConfig({ primary_color: value }),
              },
              {
                get: () =>
                  config.surface_color || defaultConfig.surface_color,
                set: (value) =>
                  window.elementSdk.setConfig({ surface_color: value }),
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) =>
                  window.elementSdk.setConfig({ text_color: value }),
              },
            ],
            borderables: [],
            fontEditable: undefined,
            fontSizeable: undefined,
          }),
          mapToEditPanelValues: (config) =>
            new Map([
              ["site_title", config.site_title || defaultConfig.site_title],
              [
                "welcome_message",
                config.welcome_message || defaultConfig.welcome_message,
              ],
              ["tagline", config.tagline || defaultConfig.tagline],
            ]),
        });
      }

      // Tab switching
      function switchTab(tab) {
        currentTab = tab;
        const loginTab = document.getElementById("login-tab");
        const signupTab = document.getElementById("signup-tab");
        const loginForm = document.getElementById("login-form");
        const signupForm = document.getElementById("signup-form");
        const successMessage = document.getElementById("success-message");

        successMessage.classList.add("hidden");

        if (tab === "login") {
          loginTab.classList.add("active");
          signupTab.classList.remove("active");
          signupTab.classList.add("text-gray-600");
          loginForm.classList.remove("hidden");
          signupForm.classList.add("hidden");
        } else {
          signupTab.classList.add("active");
          loginTab.classList.remove("active");
          loginTab.classList.add("text-gray-600");
          signupForm.classList.remove("hidden");
          loginForm.classList.add("hidden");
        }

        updateButtonState();
      }

      // Role selection
      function selectRole(role) {
        selectedRole = role;
        const teacherBtn = document.getElementById("teacher-btn");
        const studentBtn = document.getElementById("student-btn");
        const hodBtn = document.getElementById("hod-btn");
        const formContainer = document.getElementById("form-container");
        const loginBtn = document.getElementById("login-btn");
        const signupBtn = document.getElementById("signup-btn");

        teacherBtn.classList.remove("selected");
        studentBtn.classList.remove("selected");
        hodBtn.classList.remove("selected");
        formContainer.classList.remove(
          "teacher-mode",
          "student-mode",
          "hod-mode",
        );
        loginBtn.classList.remove(
          "btn-submit-teacher",
          "btn-submit-student",
          "btn-submit-hod",
        );
        signupBtn.classList.remove(
          "btn-submit-teacher",
          "btn-submit-student",
          "btn-submit-hod",
        );

        if (role === "teacher") {
          teacherBtn.classList.add("selected");
          formContainer.classList.add("teacher-mode");
          loginBtn.classList.add("btn-submit-teacher");
          signupBtn.classList.add("btn-submit-teacher");
        } else if (role === "student") {
          studentBtn.classList.add("selected");
          formContainer.classList.add("student-mode");
          loginBtn.classList.add("btn-submit-student");
          signupBtn.classList.add("btn-submit-student");
        } else if (role === "hod") {
          hodBtn.classList.add("selected");
          formContainer.classList.add("hod-mode");
          loginBtn.classList.add("btn-submit-hod");
          signupBtn.classList.add("btn-submit-hod");
        }

        updateButtonState();
      }

      // Update button state
      function updateButtonState() {
        const loginBtn = document.getElementById("login-btn");
        const signupBtn = document.getElementById("signup-btn");

        loginBtn.disabled = !selectedRole;
        signupBtn.disabled = !selectedRole;
      }

      // Toggle password visibility
      function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        input.type = input.type === "password" ? "text" : "password";
      }

      // Handle login
      async function handleLogin(e) {
        e.preventDefault();

        if (!selectedRole) {
          showError("Role Required", "Please select if you are a Student, Teacher, or HOD.");
          return;
        }

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value.trim();
        const successMessage = document.getElementById("success-message");
        const successText = document.getElementById("success-text");
        const successSubtext = document.getElementById("success-subtext");

        // Hardcoded demo authentication for testing without a backend API
        const validUsers = {
          'aditya@gmail.com': { pass: '123', role: 'student', name: 'Aditya' },
          'rahul@gmail.com': { pass: '123', role: 'teacher', name: 'Rahul Sir' },
          'hod@gmail.com': { pass: '123', role: 'hod', name: 'Sharma Sir' }
        };

        if (validUsers[email] && validUsers[email].pass === password) {
          const user = validUsers[email];

          // Verify role matches
          if (user.role !== selectedRole) {
            showError("Role Mismatch", `This account is registered as a ${user.role}. Please select the correct role.`);
            return;
          }

          // Success UI
          resetMessageStyle();
          successText.textContent = `Welcome back, ${user.name}!`;
          successSubtext.textContent = `Logged in as ${email}`;
          successMessage.classList.remove("hidden");

          // Save user session
          const sessionUser = {
            id: email === 'aditya@gmail.com' ? 1 : email === 'rahul@gmail.com' ? 2 : 3,
            email: email,
            name: user.name,
            role: user.role
          };

          localStorage.setItem('currentUser', JSON.stringify(sessionUser));
          localStorage.setItem('eduportal_session', JSON.stringify(sessionUser));

          // Redirect after a short delay
          setTimeout(() => {
            if (selectedRole === 'student') window.location.href = 'student/html/student-dashboard.html';
            else if (selectedRole === 'teacher') window.location.href = 'teachers/html/teachers-dashboard.html';
            else if (selectedRole === 'hod') window.location.href = 'HOD/html/hod-dashboard.html';
          }, 1000);

          // Reset form
          document.getElementById("login-form").reset();
        } else {
          showError("Login Failed", "Invalid email or password.");
        }
      }

      // Handle signup
      async function handleSignup(e) {
        e.preventDefault();

        if (!selectedRole) {
          showError("Role Required", "Please select a role before signing up.");
          return;
        }

        const name = document.getElementById("signup-name").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const password = document.getElementById("signup-password").value.trim();
        const confirm = document.getElementById("signup-confirm").value.trim();

        if (password !== confirm) {
          showError("Passwords do not match", "Please try again");
          return;
        }

        try {
          // Hardcoded static signup mock (Data resets on reload since no DB)
          if (email === "aditya@gmail.com" || email === "rahul@gmail.com" || email === "hod@gmail.com") {
            showError("Account Exists", "This email is already registered.");
            return;
          }

          // Simulate network delay
          await new Promise(r => setTimeout(r, 500));

          // Mock Success
          const successMessage = document.getElementById("success-message");
          const successText = document.getElementById("success-text");
          const successSubtext = document.getElementById("success-subtext");

          resetMessageStyle();

          successText.textContent = `Account created, ${name}!`;
          successSubtext.textContent = `You're registered as a ${selectedRole}`;
          successMessage.classList.remove("hidden");

          // Reset form
          document.getElementById("signup-form").reset();
        } catch (error) {
          console.error(error);
          showError("System Error", "Could not create account.");
        }
      }

      function resetMessageStyle() {
        const successMessage = document.getElementById("success-message");
        const successText = document.getElementById("success-text");
        const successSubtext = document.getElementById("success-subtext");

        successMessage.querySelector(".w-10").classList.add("bg-green-100");
        successMessage.querySelector(".w-10").classList.remove("bg-red-100");
        successMessage.querySelector("svg").classList.add("text-green-600");
        successMessage.querySelector("svg").classList.remove("text-red-600");
        successMessage.classList.add("bg-green-50", "border-green-200");
        successMessage.classList.remove("bg-red-50", "border-red-200");
        successText.classList.add("text-green-800");
        successText.classList.remove("text-red-800");
        successSubtext.classList.add("text-green-600");
        successSubtext.classList.remove("text-red-600");
      }

      function showError(title, message) {
        const successMessage = document.getElementById("success-message");
        const successText = document.getElementById("success-text");
        const successSubtext = document.getElementById("success-subtext");

        successMessage.classList.remove("hidden");
        successMessage.querySelector(".w-10").classList.remove("bg-green-100");
        successMessage.querySelector(".w-10").classList.add("bg-red-100");
        successMessage.querySelector("svg").classList.remove("text-green-600");
        successMessage.querySelector("svg").classList.add("text-red-600");
        successMessage.classList.remove("bg-green-50", "border-green-200");
        successMessage.classList.add("bg-red-50", "border-red-200");
        successText.classList.remove("text-green-800");
        successText.classList.add("text-red-800");
        successText.textContent = title;
        successSubtext.classList.remove("text-green-600");
        successSubtext.classList.add("text-red-600");
        successSubtext.textContent = message;
      }
    </script>
