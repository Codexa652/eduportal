 <head>

    * { font-family: 'Poppins', sans-serif; }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .role-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .role-card:hover {
      transform: translateY(-4px);
    }
    
    .role-card.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .input-field {
      transition: all 0.3s ease;
      border: 2px solid #e5e7eb;
    }
    
    .input-field:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
      animation: float 20s infinite ease-in-out;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }
    
    .tab-btn {
      transition: all 0.3s ease;
    }
    
    .tab-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .success-message {
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">

          </svg>

         </div>
        </div>
        <div class="grid grid-cols-2 gap-4 mt-6"><button type="button" class="flex items-center justify-center py-3 px-4 border-2 border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
          <svg class="w-5 h-5 mr-2" viewbox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" /> <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" /> <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" /> <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />

          <svg class="w-5 h-5 mr-2" fill="#1877F2" viewbox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />

  <script>
    // State
    let selectedRole = null;
    let currentTab = 'login';
    
    // Default config
    const defaultConfig = {
      site_title: 'EduPortal',
      welcome_message: 'Welcome back! Please login to continue',
      tagline: 'Empowering education, one click at a time 📚',
      primary_color: '#667eea',
      secondary_color: '#764ba2',
      text_color: '#1f2937',
      surface_color: '#ffffff',
      accent_color: '#f093fb'
    };
    
    // Initialize Element SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          document.getElementById('site-title').textContent = config.site_title || defaultConfig.site_title;
          document.getElementById('welcome-message').textContent = config.welcome_message || defaultConfig.welcome_message;
          document.getElementById('tagline').textContent = config.tagline || defaultConfig.tagline;
        },
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => window.elementSdk.setConfig({ primary_color: value })
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => window.elementSdk.setConfig({ surface_color: value })
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => window.elementSdk.setConfig({ text_color: value })
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ['site_title', config.site_title || defaultConfig.site_title],
          ['welcome_message', config.welcome_message || defaultConfig.welcome_message],
          ['tagline', config.tagline || defaultConfig.tagline]
        ])
      });
    }
    
    // Tab switching
    function switchTab(tab) {
      currentTab = tab;
      const loginTab = document.getElementById('login-tab');
      const signupTab = document.getElementById('signup-tab');
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const successMessage = document.getElementById('success-message');
      
      successMessage.classList.add('hidden');
      
      if (tab === 'login') {
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
        signupTab.classList.add('text-gray-600');
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
      } else {
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
        loginTab.classList.add('text-gray-600');
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
      
      updateButtonState();
    }
    
    // Role selection
    function selectRole(role) {
      selectedRole = role;
      const teacherBtn = document.getElementById('teacher-btn');
      const studentBtn = document.getElementById('student-btn');
      
      teacherBtn.classList.remove('selected');
      studentBtn.classList.remove('selected');
      
      if (role === 'teacher') {
        teacherBtn.classList.add('selected');
      } else {
        studentBtn.classList.add('selected');
      }
      
      updateButtonState();
    }
    
    // Update button state
    function updateButtonState() {
      const loginBtn = document.getElementById('login-btn');
      const signupBtn = document.getElementById('signup-btn');
      
      loginBtn.disabled = !selectedRole;
      signupBtn.disabled = !selectedRole;
    }
    
    // Toggle password visibility
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }
    
    // Handle login
    function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('login-email').value;
      const successMessage = document.getElementById('success-message');
      const successText = document.getElementById('success-text');
      const successSubtext = document.getElementById('success-subtext');
      
      successText.textContent = `Welcome back, ${selectedRole}!`;
      successSubtext.textContent = `Logged in as ${email}`;
      successMessage.classList.remove('hidden');
      
      // Reset form
      document.getElementById('login-form').reset();
    }
    
    // Handle signup
    function handleSignup(e) {
      e.preventDefault();
      
      const name = document.getElementById('signup-name').value;
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      
      if (password !== confirm) {
        const successMessage = document.getElementById('success-message');
        const successText = document.getElementById('success-text');
        const successSubtext = document.getElementById('success-subtext');
        
        successMessage.classList.remove('hidden');
        successMessage.querySelector('.w-10').classList.remove('bg-green-100');
        successMessage.querySelector('.w-10').classList.add('bg-red-100');
        successMessage.querySelector('svg').classList.remove('text-green-600');
        successMessage.querySelector('svg').classList.add('text-red-600');
        successMessage.classList.remove('bg-green-50', 'border-green-200');
        successMessage.classList.add('bg-red-50', 'border-red-200');
        successText.classList.remove('text-green-800');
        successText.classList.add('text-red-800');
        successText.textContent = 'Passwords do not match';
        successSubtext.classList.remove('text-green-600');
        successSubtext.classList.add('text-red-600');
        successSubtext.textContent = 'Please try again';
        return;
      }
      
      const successMessage = document.getElementById('success-message');
      const successText = document.getElementById('success-text');
      const successSubtext = document.getElementById('success-subtext');
      
      // Reset to green styling
      successMessage.querySelector('.w-10').classList.add('bg-green-100');
      successMessage.querySelector('.w-10').classList.remove('bg-red-100');
      successMessage.querySelector('svg').classList.add('text-green-600');
      successMessage.querySelector('svg').classList.remove('text-red-600');
      successMessage.classList.add('bg-green-50', 'border-green-200');
      successMessage.classList.remove('bg-red-50', 'border-red-200');
      successText.classList.add('text-green-800');
      successText.classList.remove('text-red-800');
      successSubtext.classList.add('text-green-600');
      successSubtext.classList.remove('text-red-600');
      
      successText.textContent = `Account created, ${name}!`;
      successSubtext.textContent = `You're registered as a ${selectedRole}`;
      successMessage.classList.remove('hidden');
      
      // Reset form
      document.getElementById('signup-form').reset();
    }
  </script>
