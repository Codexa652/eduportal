<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/student-dashboard.css">
    <link rel="stylesheet" href="../css/flashcard.css">
</head>

<body>
    <div class="dashboard-container">
        <!-- Sidebar will be injected here by JavaScript -->

        <main class="main-content">
            <div class="top-bar">
                <div class="nav-wrapper">
                    <div class="menu-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </div>
                    <a href="../../html/study.html" class="icon-btn back-btn" title="Back to Study Hub">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                </div>
                <h2 class="page-title">Flashcards</h2>
                <div class="top-actions">
                    <button class="icon-btn"><i class="fas fa-bell"></i></button>
                </div>
            </div>

            <div class="content fade-in flashcard-container">
                <div id="loading" class="loading-spinner">Loading flashcards...</div>
                <div class="scene">
                    <div class="card" id="flashcard">
                        <div class="card-face card-front">
                            <span class="label">Question</span>
                            <p id="questionText"></p>
                            <span class="hint">Click to flip</span>
                        </div>
                        <div class="card-face card-back">
                            <span class="label">Answer</span>
                            <p id="answerText"></p>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="prevBtn" class="nav-btn">&larr; Prev</button>
                    <span id="cardCounter" class="progress-counter"></span>
                    <button id="nextBtn" class="nav-btn">Next &rarr;</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/studyhub-loader.js"></script>
    <script src="../js/flashcard.js"></script>
</body>

</html>
