<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice: Blanks & Definitions | StudySpace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/student-dashboard.css">
    <link rel="stylesheet" href="../css/practice.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar will be injected here by JavaScript -->

        <main class="main-content">
            <div class="top-bar">
                <div class="nav-wrapper">
                    <div class="menu-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </div>
                    <a href="../../html/study.html" class="icon-btn back-btn" title="Back to Study Hub">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                </div>
                <h2 class="page-title">Active Practice</h2>
                <div class="top-actions">
                    <button class="icon-btn"><i class="fas fa-bell"></i></button>
                </div>
            </div>

            <div class="content fade-in">
                <div id="loading" class="loading-spinner">Loading practice content...</div>
                <section class="study-section">
                    <div class="section-header">
                        <h3>📖 Key Definitions</h3>
                        <p>Review these core concepts before testing your knowledge.</p>
                    </div>
                    <div id="definitionsContainer" class="definitions-list">
                    </div>
                </section>

                <hr class="divider">

                <section class="study-section">
                    <div class="section-header">
                        <h3>✍️ Fill in the Blanks</h3>
                        <p>Type your answer and press <strong>Enter</strong> to check.</p>
                    </div>
                    <div id="blanksContainer" class="blanks-list">
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="../js/practice.js"></script>
    <script src="../js/studyhub-loader.js"></script>
</body>
</html>
