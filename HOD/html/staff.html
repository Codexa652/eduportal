<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Staff Management | EduPortal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../commonstyle.css">
    <link rel="stylesheet" href="../../student/css/student-dashboard.css">
    <link rel="stylesheet" href="../css/hod-dashboard.css">
    <style>
        .page-title {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .welcome-section {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .welcome-section h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="top-bar">
                <div class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
                <div class="search-box"><i class="fas fa-search"></i><input type="text" placeholder="Search..."></div>
                <div class="top-actions"><button class="icon-btn"><i class="fas fa-bell"></i></button></div>
            </div>

            <!-- Content -->
            <div class="content fade-in">
                <div class="welcome-section">
                    <h1>Staff Management</h1>
                    <p>Direct view into faculty profiles, load, and assignments.</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card" style="grid-column: span 3; text-align: center; padding: 40px;">
                        <i class="fas fa-users" style="font-size: 48px; color: #10b981; margin-bottom: 15px;"></i>
                        <h3 style="color: #666;">Staff Directory</h3>
                        <p style="color: #999;">Select a department staff member to assign resources or adjust load.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Check Session
        const session = JSON.parse(localStorage.getItem('eduportal_session')) || JSON.parse(localStorage.getItem('currentUser'));
        if (!session || session.role !== 'hod') window.location.href = '../../login2.html';

        // Load Shared Sidebar
        fetch('../../sidebar.html')
            .then(res => res.text())
            .then(data => {
                const doc = new DOMParser().parseFromString(data, 'text/html');
                const container = document.querySelector('.dashboard-container');
                container.prepend(doc.getElementById('sidebar'));
                container.prepend(doc.getElementById('sidebarOverlay'));
                const script = document.createElement('script');
                script.textContent = doc.querySelector('script').textContent;
                document.body.appendChild(script);
            });

        function toggleSidebar() {
            document.getElementById('sidebar')?.classList.toggle('active');
            document.getElementById('sidebarOverlay')?.classList.toggle('active');
        }
    </script>
</body>

</html>
